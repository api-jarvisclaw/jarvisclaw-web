name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: The deployed headers ship with the build
        # Cloudflare applies public/_headers at the edge, and it reaches the edge only by
        # being copied into dist/. A build that drops it deploys a site with no CSP at
        # all — which fails open, silently, on the page that holds an API key.
        run: |
          test -f dist/_headers
          grep -q 'Content-Security-Policy' dist/_headers

      - name: The bundle is reachable under the deployed CSP
        # The unit tests read _headers as text; only a browser enforces it. A CSP whose
        # connect-src does not cover the gateway builds clean, passes every test, and
        # fails in production as an opaque network error.
        #
        # This step does not call the live gateway — CI must not depend on a third party
        # being up, and the free tier is rate-limited per IP, which a shared runner would
        # trip. It checks the one thing that is decidable offline: that the policy the
        # edge will send permits the origin the code will call.
        run: |
          python3 - <<'PY'
          import re, pathlib

          headers = pathlib.Path('dist/_headers').read_text(encoding='utf-8')
          csp = re.search(r'Content-Security-Policy:\s*(.+)', headers).group(1)
          directives = {}
          for part in csp.split(';'):
              name, _, value = part.strip().partition(' ')
              if name:
                  directives[name] = value

          src = pathlib.Path('src/lib/gateway.ts').read_text(encoding='utf-8')
          # The fallback after `??`, not the whole expression. This regex used to require a
          # bare string literal, so when DEFAULT_BASE_URL gained a VITE_GATEWAY_URL override
          # it matched nothing and `.group(1)` raised AttributeError — the step went red for
          # two PRs while appearing to be a real CSP failure. Anchored on the fallback because
          # that is the origin a production build actually calls.
          m = re.search(r"DEFAULT_BASE_URL\s*=\s*(?:.*\?\?\s*)?'([^']+)'", src, re.S)
          assert m is not None, 'could not read DEFAULT_BASE_URL from src/lib/gateway.ts'
          base = m.group(1)
          connect = directives.get('connect-src', '')
          assert base in connect, f'CSP connect-src does not allow {base}: {connect}'
          print(f'connect-src allows {base}')

          # media-src must exist and allow data:, or generated audio and video are refused by
          # the default-src fallback. That failure is invisible in the markup — the src
          # attribute reads correctly while the player stays dead, which after a real charge
          # is indistinguishable from a call that produced nothing.
          media = directives.get('media-src')
          assert media is not None, f'CSP has no media-src, so paid audio and video cannot play: {csp}'
          for token in ("'self'", 'data:'):
              assert token in media, f'media-src is missing {token}: {media}'
          print(f'media-src allows {media}')

          # The gallery POSTs each paid artifact to the CDN to store it permanently. If that
          # host is missing from connect-src the request is blocked before it is sent, and every
          # generated file silently keeps an upstream URL that expires within hours — a gallery
          # of dead links, with nothing in the UI to say why.
          gallery = pathlib.Path('src/lib/gallery.ts').read_text(encoding='utf-8')
          mc = re.search(r"CDN_BASE_URL\s*=\s*(?:.*\?\?\s*)?'([^']+)'", gallery, re.S)
          assert mc is not None, 'could not read CDN_BASE_URL from src/lib/gallery.ts'
          assert mc.group(1) in connect, f'CSP connect-src does not allow {mc.group(1)}: {connect}'
          print(f'connect-src allows {mc.group(1)}')
          PY
